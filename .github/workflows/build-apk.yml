name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct Android Studio project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/visualizador-src /tmp/visualizador-src.zip
          mkdir -p /tmp/visualizador-src
          cat android/source.b64.* | base64 --decode > /tmp/visualizador-src.zip
          echo "10e2d6c972cefb54d45368679788566086d66c8714df18a875ebb92dc3996c2e  /tmp/visualizador-src.zip" | sha256sum -c -
          unzip -q /tmp/visualizador-src.zip -d /tmp/visualizador-src
          PROJECT_DIR="$(find /tmp/visualizador-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/VisualizadorIO-v1.2.0-debug.apk
          sha256sum out/VisualizadorIO-v1.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualizadorIO-v1.2.0-debug-apk
          path: out/VisualizadorIO-v1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
