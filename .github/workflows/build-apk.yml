name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/source.b64.*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct Android Studio project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/visualizador-src /tmp/visualizador-src.tar.xz
          mkdir -p /tmp/visualizador-src
          cat android/source.b64.[0-9][0-9][0-9] | tr -d '\r\n ' | base64 --decode > /tmp/visualizador-src.tar.xz
          echo "b2f685e32c168560aed64733ff8deb22bf3bff8684322b7bb21365c7c5685b7c  /tmp/visualizador-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/visualizador-src.tar.xz -C /tmp/visualizador-src
          PROJECT_DIR="/tmp/visualizador-src/VisualizadorIO_Android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/VisualizadorIO-v1.2.0-debug.apk
          sha256sum out/VisualizadorIO-v1.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualizadorIO-v1.2.0-debug-apk
          path: out/VisualizadorIO-v1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
